<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#a33f1f" />
		<title>Offline - Buku UMKM</title>
		<style>
			:root {
				font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
					sans-serif;
				color: #261c18;
				background: #faf8f5;
			}
			body {
				display: grid;
				min-height: 100vh;
				margin: 0;
				place-items: center;
			}
			main {
				width: min(28rem, calc(100% - 2rem));
				text-align: center;
			}
			.logo {
				display: grid;
				width: 3rem;
				height: 3rem;
				margin: 0 auto 1.25rem;
				border-radius: 0.75rem;
				background: #a33f1f;
				color: white;
				font-size: 1.25rem;
				font-weight: 700;
				place-items: center;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.5rem;
			}
			p {
				margin: 0 0 1.5rem;
				color: #74665f;
				line-height: 1.6;
			}
			button {
				min-height: 3rem;
				padding: 0.75rem 1.25rem;
				border: 0;
				border-radius: 0.625rem;
				background: #a33f1f;
				color: white;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="logo" aria-hidden="true">B</div>
			<h1>Anda sedang offline</h1>
			<p>
				Buku UMKM memerlukan internet untuk membuka data dan menyimpan perubahan. Draft transaksi
				yang sudah diketik di perangkat ini akan tetap tersedia saat Anda kembali.
			</p>
			<button type="button" onclick="location.reload()">Coba lagi</button>
		</main>
	</body>
</html>
